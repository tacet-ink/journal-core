name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # self-hosted runner：labels 自訂 journal-core ＋預設 self-hosted
    # 同 repo 保衛：public repo ＋ self-hosted ＝ 只接同 repo branch——fork／
    # 他 repo branch 的 pull_request 一律不上 runner（host-compromise 防線）
    # Dependabot 分流（t_87ef62dd；0.5.3 J4 改鍵）：PR 作者（github.event.pull_request.user.login）＝dependabot[bot] → GitHub-hosted
    # ubuntu-latest（供應鏈隔離——self-hosted runner 不接機器人分支；分流不是擋，
    # 機器人分支照跑驗證）；其餘（含 dependabot 以外的 PR）self-hosted[journal-core]。
    # 鍵取 PR 作者欄而非事件觸發者欄：synchronize/reopen 的觸發者可為任何協作者（人為
    # 觸發即可把機器人分支推上 self-hosted）；反之 dependabot 分支由人 rerun 時觸發者非 bot。
    # PR 作者欄恆為開 PR 的身分＝分流鍵單一真相。
# runs-on 兩臂一律 fromJSON 陣列形——裸逗號字串（'self-hosted, journal-core'）＝runner
# 解析器 StringToken 整串單加＝一枚 literal 標籤；標籤組唯有陣列形展開（r2 MAJOR-1）。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && '["ubuntu-latest"]' || '["self-hosted","journal-core"]') }}
    steps:
      # actions/checkout v7.0.1（SHA 釘選——供應鏈裁定：密碼學套件 repo
      # 的 CI 不吃浮動 tag）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install dependencies (scripts off — supply-chain face)
        # --ignore-scripts：依賴腳本零在場（postinstall/preinstall/prepare 全免執行——
        # 供應鏈面；verify/typecheck 需要的 tsc/@scure 純 JS 在場即足）。需要腳本時
        # 分步驟顯式跑，禁恢復全量 scripts（t_87ef62dd 裁定）。
        run: npm ci --ignore-scripts

      - name: Install typescript (dts-fixture 前置——顯式保證 node_modules/typescript 在場)
        # 0.5.3 J4（D4 裁定）：dts-fixture.cjs 以 node_modules/typescript/bin/tsc 跑消費端 .d.ts
        # 檢查。typescript 已在 lockfile devDeps（上一步 npm ci --ignore-scripts 純 JS 在場即足
        # ＝Typecheck 同一前提）；本步為前置顯式保證——lockfile 日後若移除 typescript devDep，
        # dts-fixture 仍有 tsc 可用。版本釘 lockfile 解析值（裸 `typescript` 走 latest tag＝
        # 可能高於 lockfile＝typecheck 用上非鎖定 tsc）；--no-save：package.json／lockfile 零動；
        # --ignore-scripts 在場＝「禁恢復 scripts」裁定同向（typescript 本無 install 腳本；旗標令此步在
        # 腳本面防禦上永不例外——未來 dependency 變化零腳本執行面）。
        run: |
          TS_VER="$(node -p "require('./package-lock.json').packages['node_modules/typescript'].version")"
          npm install --no-save --no-audit --no-fund --ignore-scripts "typescript@${TS_VER}"

      - name: Typecheck
        run: npm run typecheck

      - name: Build dist (dts-fixture／subpath probe 前置——npm pack 不觸發 prepublishOnly)
        # exports 恆指 dist（0.3.0 起）：dist 不入版控；下兩步各自 npm pack → 臨時安裝，
        # tarball 白名單 files=dist/docs/migrations——未建 dist 的 tarball 零 .d.ts 零 .js＝兩探針必紅。
        run: npm run build

      # dts-fixture.cjs:2 註解宣稱的 CI 等價步（0.5.3 J4 落真）：pack → 臨時安裝 → skipLibCheck:false
      # 兩組 moduleResolution（nodenext／bundler）tsc 皆綠＝消費端 .d.ts 面；閘 [21] 咬此步在場。
      - name: dts-fixture (.d.ts consumers, both moduleResolution)
        run: node scripts/dts-fixture.cjs

      # 子路徑 runtime import 探針（0.5.3 J4）：repo package.json exports 每鍵（15）在臨時安裝樹
      # `node -e import()` 逐鍵子行程——0.5.0 漏 ./client/keyring exports 型回歸網（dts-fixture 只證
      # 型別面；本步證 runtime 解析面）。不需 typescript；閘 [21] 咬此步在場。
      - name: Subpath import probe (package.json exports, runtime ESM)
        run: node scripts/ci-subpath-probe.cjs

      # 斷言數以腳本實際輸出為準（npm run verify 自帶「N 斷言全綠」尾行）
      - name: Verify crypto primitives
        run: npm run verify
