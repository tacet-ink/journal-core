name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # self-hosted runner（t_046fe36f）：labels 自訂 journal-core ＋預設 self-hosted
    runs-on: [self-hosted, journal-core]
    steps:
      # actions/checkout v7.0.1（SHA 釘選——供應鏈裁定 t_b91ed07f：密碼學套件 repo
      # 的 CI 不吃浮動 tag）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 斷言數以腳本實際輸出為準（npm run verify 自帶「N 斷言全綠」尾行）
      - name: Verify crypto primitives
        run: npm run verify