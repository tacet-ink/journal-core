name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm Trusted Publishing (OIDC) — 取代長效 NPM_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      # actions/checkout v7.0.1（SHA 釘選——供應鏈裁定 t_b91ed07f：可發布到 npm 的
      # workflow（id-token: write）不吃浮動 tag）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26   # npm >= 11.5.1（Trusted publishing 最低需求）

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify crypto primitives
        run: npm run verify

      - name: Check tag matches package version
        # workflow_dispatch（branch ref）無 v-tag：直接 fail-fast 標記「須推 v* tag」，
        # 不誤踩「tag != package version」檢查錯訊（t_b91ed07f 殘餘 N-3；t_580f9c54 落地）。
        if: github.ref_type != 'tag'
        run: |
          echo "::error::publish runs on tag refs only (GITHUB_REF_TYPE=$GITHUB_REF_TYPE); push a v* tag."
          exit 1

      - name: Check tag matches package version (tag ref)
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG != package.json $PKG"
            exit 1
          fi

      - name: Publish with provenance (OIDC trusted publishing)
        run: npm publish --access public --provenance
        # 無 NPM_TOKEN：npm CLI 自動偵測 Actions OIDC 環境換短效 token。
        # 前置（npmjs.com）：package settings → Trusted Publisher → GitHub Actions，
        # 填 user/repo/workflow filename(publish.yml)/environment(npm)。