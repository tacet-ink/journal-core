name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm Trusted Publishing (OIDC) — 取代長效 NPM_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      # actions/checkout v4.2.2（SHA 釘選——供應鏈裁定 t_b91ed07f：可發布到 npm 的
      # workflow（id-token: write）不吃浮動 tag）
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26   # npm >= 11.5.1（Trusted publishing 最低需求）

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify crypto primitives
        run: npm run verify

      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG != package.json $PKG"
            exit 1
          fi

      - name: Publish with provenance (OIDC trusted publishing)
        run: npm publish --access public --provenance
        # 無 NPM_TOKEN：npm CLI 自動偵測 Actions OIDC 環境換短效 token。
        # 前置（npmjs.com）：package settings → Trusted Publisher → GitHub Actions，
        # 填 user/repo/workflow filename(publish.yml)/environment(npm)。